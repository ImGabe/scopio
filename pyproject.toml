[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scopio"
version = "0.3.0"
description = "Code metrics auditor with SQLite history, diffs and quality gates."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Gabriel P. Monte", email = "gabrielpmonte@users.noreply.github.com" },
]
keywords = ["metrics", "code-quality", "ccn", "lizard", "scc", "audit", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["click>=8.1", "lizard>=1.24,<1.25"]

[project.urls]
Homepage = "https://github.com/imgabe/scopio"
Repository = "https://github.com/imgabe/scopio"
Issues = "https://github.com/imgabe/scopio/issues"

[project.scripts]
scopio = "scopio.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.15",
    "commitizen>=4",
    "pre-commit>=4",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
version_files = ["scopio/__init__.py:__version__"]
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = true
bump_message = "chore: bump version to $new_version"

[tool.hatch.build.targets.wheel]
packages = ["scopio"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PT", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["tests/"]