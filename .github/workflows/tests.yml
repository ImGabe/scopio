name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest tests/ -q --cov=scopio --cov-fail-under=75 --cov-report=term

      - name: Check diff.py coverage
        run: uv run pytest tests/ -q --cov=scopio.diff --cov-fail-under=70 --cov-report=term

      - name: Run type checks
        run: uv run mypy scopio/

  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Install scc
        run: |
          curl -fsSL https://github.com/boyter/scc/releases/download/v3.3.0/scc_3.3.0_Linux_x86_64.tar.gz -o /tmp/scc.tar.gz
          sudo tar -xzf /tmp/scc.tar.gz -C /usr/local/bin scc
          sudo chmod +x /usr/local/bin/scc
          rm /tmp/scc.tar.gz

      - name: Generate config
        run: uv run scopio init || true

      - name: Run scopio audit
        run: uv run scopio run --verbose

      - name: Run scopio CI check
        run: uv run scopio ci --project scopio
        continue-on-error: true
