repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.12
    hooks:
      - id: uv-lock
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: lizard-ccn-check
        name: lizard CCN check (MaxCCN <= 15)
        entry: uv run lizard -C 15 scopio/
        language: system
        pass_filenames: false
      - id: scopio-audit-check
        name: scopio self-audit (quality gates)
        entry: uv run scopio run --verbose
        language: system
        pass_filenames: false
      - id: scopio-check
        name: scopio quality check (diff --dirty)
        entry: uv run scopio diff --dirty
        language: system
        pass_filenames: false


